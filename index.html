<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Progress</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200&family=Rum+Raisin&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg">
    <style>
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #1F57AB;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hero {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .circle {
            width: 300px;
            height: 300px;
            background-color: #BFD9FF;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            font-size: 28px;
            color: #1F57AB;
            font-style: italic;
        }

        #bottomPartOfPage {
            background-color: #e7f1ff;
            padding-top: 2%;
            padding-bottom: 5%;
        }

        #resume {
            font-size: 40px;
            text-align: center;
            font-weight: bold;
            font-family: 'Rum Raisin', sans-serif;
            color: #1F57AB;
        }

        #resumeSection {
            display: flex;
            justify-content: center;
        }

        #resumeButton {
            border-radius: 50%;
            border-style: solid;
            border-color: black;
            width: 80px;
            height: 80px;
            padding: 2%;
            margin-bottom: 5%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #letsConnect {
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            font-family: 'Rum Raisin', sans-serif;
            color: #1F57AB;
        }

        #connect {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #email, #linkedin {
            border-radius: 50%;
            border-style: solid;
            width: 80px;
            height: 80px;
            text-align: center;
            padding: 1%;
            font-weight: bold;
            border-color: black;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #oval1, #oval2 {
            border-style: solid;
            border-radius: 50%;
            background-color: #7DAFFA;
            width: 80px;
            height: 80px;
        }

        .drawing {
            height: 55px;
        }

        a:link, a:visited {
            color: #1F57AB;
        }

        @keyframes thickBorders {
            from { border-width: medium; }
            to { border-width: thick; }
        }

        .bottomButton {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottomButton:hover {
            border-width: medium;
            animation-name: thickBorders;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        #footer {
            border-top: 4px dotted #1F57AB;
            background-color: #e7f1ff;
        }

        #copyWrite {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="circle">Website In Progress</div>
    </div>

    <div id="bottomPartOfPage">
        <p id="resume">Resume</p>
        <div id="resumeSection">
            <a href="Resume.pdf" id="resumeButton" class="bottomButton">
                <img class="drawing" src="ResumeArt.svg" alt="resume">
            </a>
        </div>

        <div id="contactMe">
            <p id="letsConnect">Let's Connect!</p>
            <div id="connect">
                <div id="oval1"></div>
                <a href="mailto:devinvonarx@gmail.com" id="email" class="bottomButton">
                    <img class="drawing" src="MailArt.svg" alt="mail">
                </a>
                <a href="https://www.linkedin.com/in/devin-von-arx" id="linkedin" class="bottomButton">
                    <img class="drawing" src="LinkedinArt.svg" alt="linkedin">
                </a>
                <div id="oval2"></div>
            </div>
        </div>
    </div>

    <footer id="footer">
        <p id="copyWrite">©2026 | Devin Von Arx</p>
    </footer>

</body>
</html>
